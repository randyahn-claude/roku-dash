<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roku Dash</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a1a;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100vh; font-family:'Segoe UI',sans-serif; overflow:hidden; user-select:none;
}
canvas { display:block; border:2px solid #2a2a4a; border-radius:6px; cursor:pointer; }
#ui-bar {
  display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; justify-content:center;
}
.btn {
  background:#1e1e3a; color:#aaa; border:1px solid #333; border-radius:6px;
  padding:5px 13px; font-size:0.78rem; cursor:pointer; transition:all 0.15s; letter-spacing:0.04em;
}
.btn:hover { background:#2e2e5a; color:#fff; border-color:#6c2bce; }
.btn.active { background:#6c2bce; color:#fff; border-color:#9d5cf6; }

/* PANELS */
.panel {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  z-index:100; flex-direction:column; align-items:center; padding:16px; gap:10px; overflow-y:auto;
  background:rgba(5,5,20,0.97);
}
.panel.open { display:flex; }
.panel h2 { font-size:1.3rem; letter-spacing:0.1em; margin-top:8px; }
#editor-panel h2 { color:#9d5cf6; }
#lb-panel h2 { color:#ffe000; justify-content:center; }
#lb-panel { justify-content:center; }

#editor-canvas { border:2px solid #333; border-radius:4px; cursor:crosshair; max-width:100%; }
.editor-toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.tool-btn {
  background:#1a1a30; color:#ccc; border:1px solid #444; border-radius:6px;
  padding:5px 14px; cursor:pointer; font-size:0.8rem; transition:all 0.15s;
}
.tool-btn:hover { border-color:#9d5cf6; color:#fff; }
.tool-btn.selected { background:#6c2bce; color:#fff; border-color:#9d5cf6; }
#level-list { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:700px; }
.level-chip {
  background:#1a1a30; border:1px solid #333; border-radius:6px;
  padding:5px 10px; color:#aaa; font-size:0.8rem; display:flex; gap:6px; align-items:center;
}
.chip-btn { background:none; border:none; cursor:pointer; font-size:0.75rem; }

/* LEADERBOARD */
#lb-table { width:100%; max-width:420px; border-collapse:collapse; }
#lb-table th { color:#6c2bce; font-size:0.78rem; padding:6px 12px; border-bottom:1px solid #222; text-align:left; }
#lb-table td { color:#ddd; padding:8px 12px; border-bottom:1px solid #1a1a2e; font-size:0.92rem; }
#lb-table tbody tr:nth-child(1) td { color:#ffe000; font-weight:bold; }
#lb-table tbody tr:nth-child(2) td { color:#c0c0c0; }
#lb-table tbody tr:nth-child(3) td { color:#cd7f32; }
#name-input {
  background:#1a1a30; border:1px solid #6c2bce; border-radius:8px;
  color:#fff; padding:8px 14px; font-size:1rem; outline:none; width:220px; text-align:center;
}
#name-input::placeholder { color:#555; }

/* NAME OVERLAY */
#canvas-wrapper { position:relative; display:inline-block; }
#name-overlay {
  position:absolute; display:flex; flex-direction:column;
  align-items:center; gap:10px; pointer-events:none;
}
#name-overlay.active { pointer-events:all; }
#start-name-input {
  background:rgba(20,15,50,0.92); border:2px solid #6c2bce; border-radius:10px;
  color:#fff; padding:10px 18px; font-size:1.1rem; outline:none;
  width:240px; text-align:center; transition:border-color 0.2s, box-shadow 0.2s;
}
#start-name-input:focus { border-color:#9d5cf6; box-shadow:0 0 16px rgba(108,43,206,0.5); }
#start-name-input::placeholder { color:#555; }
#name-hint { color:rgba(255,255,255,0.35); font-size:0.75rem; }
#start-btn {
  background:linear-gradient(135deg,#6c2bce,#9d5cf6); color:#fff; border:none;
  border-radius:10px; padding:10px 32px; font-size:1rem; cursor:pointer;
  transition:opacity 0.15s, transform 0.1s;
}
#start-btn:hover { opacity:0.88; transform:translateY(-1px); }
</style>
</head>
<body>
<div id="canvas-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="name-overlay" class="active">
    <input id="start-name-input" maxlength="16" placeholder="Enter your name…" autocomplete="off" spellcheck="false"/>
    <div id="name-hint">Your name will appear on the leaderboard</div>
    <button id="start-btn" onclick="startFromOverlay()">▶ START GAME</button>
  </div>
</div>
<div id="ui-bar">
  <button class="btn active" id="btn-cube"  onclick="setMode('cube')">📦 Cube</button>
  <button class="btn"        id="btn-ship"  onclick="setMode('ship')">🚀 Ship</button>
  <button class="btn"        id="btn-wave"  onclick="setMode('wave')">〰️ Wave</button>
  <button class="btn" onclick="openEditor()">🗺️ Level Editor</button>
  <button class="btn" onclick="openLeaderboard()">🏆 Leaderboard</button>
</div>

<!-- LEVEL EDITOR -->
<div id="editor-panel" class="panel">
  <h2>📺 LEVEL EDITOR</h2>
  <div class="editor-toolbar">
    <button class="tool-btn selected" id="tool-spike"    onclick="selectTool('spike')">📺 TV Spike</button>
    <button class="tool-btn"          id="tool-platform" onclick="selectTool('platform')">📺 Platform TV</button>
    <button class="tool-btn"          id="tool-erase"    onclick="selectTool('erase')">🗑️ Erase</button>
    <button class="tool-btn" onclick="clearEditorLevel()">🔄 Clear</button>
    <button class="tool-btn" onclick="saveEditorLevel()">💾 Save Level</button>
    <button class="tool-btn" onclick="playEditorLevel()">▶️ Test Level</button>
    <button class="tool-btn" onclick="closeEditor()">✕ Close</button>
  </div>
  <canvas id="editor-canvas" width="760" height="260"></canvas>
  <p style="color:#555;font-size:0.75rem;">Click to place obstacles. TV Spikes snap to ground. Platform TVs go where you click.</p>
  <div style="color:#666;font-size:0.8rem;">Saved Levels:</div>
  <div id="level-list"><span style="color:#444;font-size:0.8rem;">No saved levels yet.</span></div>
</div>

<!-- LEADERBOARD -->
<div id="lb-panel" class="panel">
  <h2>🏆 LEADERBOARD</h2>
  <input id="name-input" placeholder="Your name" maxlength="16"/>
  <table id="lb-table">
    <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Mode</th></tr></thead>
    <tbody id="lb-body"></tbody>
  </table>
  <button class="btn" onclick="closeLeaderboard()">✕ Close</button>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  ROUNDRECT POLYFILL (for older browsers)
// ─────────────────────────────────────────────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    this.closePath();
    return this;
  };
}

// ─────────────────────────────────────────────────────────────
//  SETUP
// ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
canvas.width  = 800;
canvas.height = 450;

const GROUND_Y  = canvas.height - 80;
const GROUND_H  = 80;
const CUBE_SIZE = 36;
const BASE_SPD  = 5;

// ─────────────────────────────────────────────────────────────
//  SOUND ENGINE  (Web Audio API — no files needed)
// ─────────────────────────────────────────────────────────────
let audioCtx = null;
function getAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, type, dur, vol=0.14, atk=0.01){
  const ac=getAudio(); if(!ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(vol, ac.currentTime+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur+0.05);
  }catch(e){}
}
function noise(dur, vol=0.12, bpFreq=180){
  const ac=getAudio(); if(!ac) return;
  try{
    const len=Math.ceil(ac.sampleRate*dur);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=bpFreq; f.Q.value=0.8;
    src.buffer=buf; src.connect(f); f.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    src.start(); src.stop(ac.currentTime+dur+0.05);
  }catch(e){}
}
function sfxJump(){ tone(300,'sine',0.12,0.13); setTimeout(()=>tone(460,'sine',0.08,0.08),40); }
function sfxLand(){ tone(100,'sine',0.07,0.1); }
function sfxDeath(){
  const ac=getAudio(); if(!ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(300, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, ac.currentTime+0.5);
    g.gain.setValueAtTime(0.22, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.5);
    o.start(); o.stop(ac.currentTime+0.55);
  }catch(e){}
  noise(0.3, 0.16, 200);
}
function sfxTierUp(){
  [330,440,550,700].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.2,0.18), i*65));
}
function sfxTick(){ tone(600,'sine',0.05,0.06); }

// ─────────────────────────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────────────────────────
let state      = 'waiting';
let gameMode   = 'cube';
let score      = 0;
let bgOffset   = 0;
let frameCount = 0;
let scrollSpd  = BASE_SPD;
let deathTimer = 0;
let customLevel= null;
let pressing   = false;
let wasOnGround= true;  // for landing sfx (fire only once)

// Parallax offsets
let px1=0, px2=0, px3=0;

// Tier banner
let banner = { on:false, timer:0, tier:0 };
let lastTier = 0;

// ─────────────────────────────────────────────────────────────
//  ROKU CITY SCENERY  (generated once, tiled at runtime)
// ─────────────────────────────────────────────────────────────

// Roku City palette
const RC = {
  skyTop:    '#06071a',
  skyMid:    '#0d0d35',
  skyBot:    '#1a0e3d',
  horizGlow: '#3d1a6e',
  moonColor: '#e8d5ff',
  starColor: '#cbb8ff',
  // Building silhouette layers
  farBldg:   '#0f0a28',
  midBldg:   '#160d35',
  nearBldg:  '#1e1040',
  // Neon accent colors (very Roku City)
  neonPurple:'#9d5cf6',
  neonTeal:  '#00e5c8',
  neonPink:  '#ff2d8a',
  neonBlue:  '#2d6aff',
  neonAmber: '#ffb830',
  // Window colors
  winWarm:   'rgba(255,210,120,0.6)',
  winCool:   'rgba(120,160,255,0.5)',
  winPurple: 'rgba(180,100,255,0.55)',
  winTeal:   'rgba(0,220,200,0.45)',
  // Ground
  groundTop: '#1a0e3d',
  groundBot: '#0a0520',
  roadLine:  'rgba(157,92,246,0.35)',
};

// Stars / distant lights
const STARS = Array.from({length:70},(_,i)=>({
  x:(i*197+13)%800,
  y:(i*83+7)%(GROUND_Y*0.55),
  r:((i*31)%3)===0?1.2:0.6,
  phase:(i*17)%62,
  col: i%4===0?RC.neonTeal : i%7===0?RC.neonPurple : RC.starColor
}));

// Moon
const MOON = { x:640, y:55, r:22 };

// FAR buildings — distant, dark, tall spires (layer 1, 0.15x)
const FAR_B = Array.from({length:28},(_,i)=>({
  x:(i*71+10)%900, w:12+((i*23)%22), h:35+((i*53)%100),
  hasSpire: i%3===0,
  spireH: 15+((i*7)%20),
}));

// MID buildings — more detail, lit windows, varied shapes (layer 2, 0.35x)
const MID_BLDG_TYPES=['rect','rect','rect','setback','tower'];
const MID_B = Array.from({length:18},(_,i)=>({
  x:(i*103+30)%960, w:22+((i*41)%36), h:55+((i*67)%130),
  type: MID_BLDG_TYPES[i%5],
  setbackAt: 0.55+((i*13)%30)*0.01,
  setbackW:  0.6+((i*7)%3)*0.1,
  winRows: 3+((i*3)%5),
  winCols: 2+((i*5)%3),
  winCol: [RC.winWarm,RC.winCool,RC.winPurple,RC.winTeal][i%4],
  roofLight: [RC.neonPurple,RC.neonTeal,RC.neonPink,RC.neonBlue,RC.neonAmber][i%5],
  hasAntenna: i%3===0,
  hasTank: i%5===0,
}));

// NEAR buildings — close, large, highly detailed (layer 3, 0.65x)
const NEAR_B = Array.from({length:10},(_,i)=>({
  x:(i*143+25)%1050, w:40+((i*53)%60), h:70+((i*79)%110),
  winCol: [RC.winWarm,RC.winPurple,RC.winTeal,RC.winCool][i%4],
  billboard: i%3===0,
  billCol: [RC.neonPink,RC.neonTeal,RC.neonPurple,RC.neonAmber][i%4],
  billText: ['ROKU','STREAM','4K HDR','WATCH','NOW','LIVE'][i%6],
  roofLight: [RC.neonPurple,RC.neonTeal,RC.neonPink][i%3],
}));

// ─────────────────────────────────────────────────────────────
//  LEADERBOARD
// ─────────────────────────────────────────────────────────────
function getLB(){ try{return JSON.parse(localStorage.getItem('rd_lb')||'[]');}catch{return [];} }
function saveLB(lb){ try{localStorage.setItem('rd_lb',JSON.stringify(lb));}catch{} }
function addScore(name,sc,mode){
  const lb=getLB(); lb.push({name:name||'Anonymous',score:sc,mode});
  lb.sort((a,b)=>b.score-a.score); saveLB(lb.slice(0,20));
}
function getBest(){ const lb=getLB(); return lb.length?lb[0].score:0; }
function renderLB(){
  const lb=getLB(); const medals=['🥇','🥈','🥉'];
  document.getElementById('lb-body').innerHTML = lb.length===0
    ? '<tr><td colspan="4" style="color:#444;font-style:italic;padding:12px">No scores yet!</td></tr>'
    : lb.slice(0,10).map((e,i)=>`<tr><td>${medals[i]||i+1}</td><td>${e.name}</td><td>${e.score}</td><td>${e.mode}</td></tr>`).join('');
}
function openLeaderboard(){ renderLB(); document.getElementById('lb-panel').classList.add('open'); }
function closeLeaderboard(){ document.getElementById('lb-panel').classList.remove('open'); }

// ─────────────────────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────────────────────
const player = {
  x:120, y:GROUND_Y-CUBE_SIZE, vy:0, angle:0,
  jumpsLeft:2, alive:true, trailPts:[], onGround:false,

  reset(){
    this.y=GROUND_Y-CUBE_SIZE; this.vy=0; this.angle=0;
    this.jumpsLeft=2; this.alive=true; this.trailPts=[]; this.onGround=false;
  },

  action(){
    if(!this.alive) return;
    if(gameMode==='cube' && this.jumpsLeft>0){
      this.vy=-13; this.jumpsLeft--; spawnJumpFx(); sfxJump();
    } else if(gameMode==='ship'){
      this.vy=-5;
    }
    // wave: driven by 'pressing'
  },

  update(){
    const prevOnGround = this.onGround;

    if(gameMode==='cube'){
      this.vy+=0.6; this.y+=this.vy;
      if(this.y>=GROUND_Y-CUBE_SIZE){
        this.y=GROUND_Y-CUBE_SIZE; this.vy=0; this.jumpsLeft=2;
        this.angle=Math.round(this.angle/(Math.PI/2))*(Math.PI/2);
        this.onGround=true;
      } else { this.angle+=0.08; this.onGround=false; }
      if(this.y<0) killPlayer();

    } else if(gameMode==='ship'){
      if(pressing) this.vy-=0.55;
      this.vy+=0.28; this.vy=Math.max(-8,Math.min(8,this.vy));
      this.y+=this.vy; this.angle=this.vy*0.07;
      this.onGround=false;
      if(this.y>=GROUND_Y-CUBE_SIZE){this.y=GROUND_Y-CUBE_SIZE;this.vy=0;this.onGround=true;}
      if(this.y<0){this.y=0;this.vy=0;}

    } else if(gameMode==='wave'){
      this.vy=pressing?-4.5:4.5; this.y+=this.vy; this.angle=this.vy*0.1;
      this.onGround=false;
      if(this.y>=GROUND_Y-CUBE_SIZE){this.y=GROUND_Y-CUBE_SIZE;this.onGround=true;}
      if(this.y<0) this.y=0;
    }

    // Land sfx — fire only on the frame we touch ground
    if(!prevOnGround && this.onGround) sfxLand();

    this.trailPts.unshift({x:this.x+CUBE_SIZE/2, y:this.y+CUBE_SIZE/2});
    if(this.trailPts.length>16) this.trailPts.pop();
  },

  get rect(){
    const p=gameMode==='wave'?7:4;
    return {x:this.x+p, y:this.y+p, w:CUBE_SIZE-p*2, h:CUBE_SIZE-p*2};
  }
};

// ─────────────────────────────────────────────────────────────
//  DIFFICULTY
// ─────────────────────────────────────────────────────────────
function getTier(){
  if(score<5)  return 0;
  if(score<13) return 1;
  if(score<25) return 2;
  if(score<40) return 3;
  return 4;
}
function getSpawnInterval(){
  const base=[88,68,52,40,30][getTier()];
  return base + Math.floor(Math.random()*10) - 5;
}

// ─────────────────────────────────────────────────────────────
//  OBSTACLES
// ─────────────────────────────────────────────────────────────
let obstacles=[], spawnTimer=0, spawnInterval=88;

function tvO(x,y,w,h){ return {type:'spike',x,y,w,h}; }
function ceilO(x,w,h){ return {type:'ceiling_spike',x,y:0,w,h}; }

function wRand(items){
  let r=Math.random()*items.reduce((s,i)=>s+i.w,0);
  for(const i of items){ r-=i.w; if(r<=0) return i.v; }
  return items[0].v;
}

function spawnObstacle(){
  if(customLevel) return;
  const tier=getTier();
  const X=canvas.width+40;
  const pool=[];
  if(tier>=0) pool.push({v:'single',w:40},{v:'gap_wide',w:30});
  if(tier>=1) pool.push({v:'double',w:30},{v:'platform_spike',w:25},{v:'gap_medium',w:20});
  if(tier>=2) pool.push({v:'ceiling_tv',w:25},{v:'triple',w:20},{v:'stacked',w:15},{v:'moving',w:20});
  if(tier>=3) pool.push({v:'ceil_gauntlet',w:20},{v:'bouncing',w:20},{v:'gap_tight',w:15},{v:'stagger',w:15});
  if(tier>=4) pool.push({v:'tvwall',w:20},{v:'ceil_floor',w:18},{v:'chaos',w:15});

  switch(wRand(pool)){
    case 'single':   obstacles.push(tvO(X,GROUND_Y,38,44)); break;
    case 'gap_wide': obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(tvO(X+165,GROUND_Y,38,44)); break;
    case 'double':   obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(tvO(X+50,GROUND_Y,38,44)); break;
    case 'gap_medium': obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(tvO(X+115,GROUND_Y,38,44)); break;
    case 'platform_spike':{
      const py=GROUND_Y-100-Math.random()*50;
      obstacles.push({type:'platform',x:X,y:py,w:90,h:14});
      obstacles.push(tvO(X+26,py,30,34));
      break;
    }
    case 'ceiling_tv': obstacles.push(ceilO(X+20,38,50)); obstacles.push(tvO(X+105,GROUND_Y,38,44)); break;
    case 'triple':  obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(tvO(X+52,GROUND_Y,38,44)); obstacles.push(tvO(X+104,GROUND_Y,38,44)); break;
    case 'stacked': obstacles.push(tvO(X+10,GROUND_Y,38,44)); obstacles.push(tvO(X+10,GROUND_Y-52,26,30)); break;
    case 'moving':{
      const base=GROUND_Y-80;
      obstacles.push({...tvO(X,base,38,44), vy:1.5, bounceTop:base-90, bounceBot:GROUND_Y, bouncing:true});
      break;
    }
    case 'ceil_gauntlet': obstacles.push(ceilO(X,38,55)); obstacles.push(tvO(X+75,GROUND_Y,38,44)); obstacles.push(ceilO(X+140,38,55)); break;
    case 'bouncing':{
      obstacles.push({...tvO(X,GROUND_Y-65,36,42), vy:-2.5, bounceTop:GROUND_Y-155, bounceBot:GROUND_Y, bouncing:true});
      break;
    }
    case 'gap_tight': obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(tvO(X+82,GROUND_Y,38,44)); obstacles.push(tvO(X+164,GROUND_Y,38,44)); break;
    case 'stagger':   obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(tvO(X+62,GROUND_Y-62,30,36)); obstacles.push(tvO(X+124,GROUND_Y,38,44)); break;
    case 'tvwall':{
      const gapY=80+Math.random()*(GROUND_Y-160);
      obstacles.push({type:'tvwall',x:X,y:0,w:30,h:0,gapY,gapH:72});
      break;
    }
    case 'ceil_floor': obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(ceilO(X,38,50)); obstacles.push(tvO(X+95,GROUND_Y,38,44)); obstacles.push(ceilO(X+95,38,50)); break;
    case 'chaos':
      obstacles.push(tvO(X,GROUND_Y,38,44)); obstacles.push(ceilO(X+52,38,48));
      obstacles.push(tvO(X+104,GROUND_Y,38,44)); obstacles.push(ceilO(X+156,38,48));
      obstacles.push(tvO(X+208,GROUND_Y,38,44));
      break;
  }
}

function updateObstacles(){
  obstacles.forEach(o=>{
    o.x-=scrollSpd;
    if(o.bouncing){
      o.y+=o.vy;
      if(o.y<=o.bounceTop){o.y=o.bounceTop;o.vy*=-1;}
      if(o.y+o.h>=o.bounceBot){o.y=o.bounceBot-o.h;o.vy*=-1;}
    }
  });
  obstacles=obstacles.filter(o=>o.x>-320);
  spawnTimer++;
  if(spawnTimer>=spawnInterval){ spawnObstacle(); spawnTimer=0; spawnInterval=getSpawnInterval(); }
}

let particles=[];
const PCOLS=['#ff4466','#ff8800','#ffe000','#fff','#9d5cf6','#00e5ff'];

function spawnDeathFx(){
  for(let i=0;i<42;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*9;
    particles.push({
      x:player.x+CUBE_SIZE/2, y:player.y+CUBE_SIZE/2,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:1, decay:0.016+Math.random()*0.022,
      size:3+Math.random()*9,
      color:PCOLS[Math.floor(Math.random()*PCOLS.length)],
      square:Math.random()>0.45, rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.25
    });
  }
}
function spawnJumpFx(){
  for(let i=0;i<8;i++){
    particles.push({
      x:player.x+CUBE_SIZE/2, y:player.y+CUBE_SIZE,
      vx:(Math.random()-0.5)*5, vy:1+Math.random()*3,
      life:1, decay:0.055, size:3+Math.random()*4,
      color:'rgba(108,43,206,0.85)', square:false, rot:0, rotV:0
    });
  }
}
function updateParticles(){
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.13;p.life-=p.decay;p.rot+=p.rotV;});
  particles=particles.filter(p=>p.life>0);
}

// ─────────────────────────────────────────────────────────────
//  COLLISION
// ─────────────────────────────────────────────────────────────
function overlaps(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function checkCollisions(){
  const pr=player.rect;
  for(const o of obstacles){
    if(o.type==='spike'){
      const hb={x:o.x+5, y:o.y-o.h+4, w:o.w-10, h:o.h-4};
      if(overlaps(pr,hb)){
        const cx=(pr.x+pr.x+pr.w)/2-o.x;
        const sY=o.y-(Math.abs(cx-o.w/2)/(o.w/2))*o.h;
        if(pr.y+pr.h>sY-4) killPlayer();
      }
    } else if(o.type==='ceiling_spike'){
      const hb={x:o.x+5, y:0, w:o.w-10, h:o.h-4};
      if(overlaps(pr,hb)){
        const cx=(pr.x+pr.x+pr.w)/2-o.x;
        const sY=(Math.abs(cx-o.w/2)/(o.w/2))*o.h;
        if(pr.y<sY+4) killPlayer();
      }
    } else if(o.type==='platform'){
      const hb={x:o.x,y:o.y,w:o.w,h:o.h};
      if(overlaps(pr,hb)){
        if(player.vy>=0&&pr.y+pr.h<=o.y+o.h+8){
          player.y=o.y-CUBE_SIZE; player.vy=0; player.jumpsLeft=2;
        } else killPlayer();
      }
    } else if(o.type==='tvwall'){
      const top={x:o.x,y:0,w:o.w,h:o.gapY-10};
      const bot={x:o.x,y:o.gapY+o.gapH,w:o.w,h:canvas.height};
      if(overlaps(pr,top)||overlaps(pr,bot)) killPlayer();
    }
  }
}

function killPlayer(){
  if(!player.alive) return;
  player.alive=false; spawnDeathFx(); deathTimer=0; sfxDeath();
  const nm=document.getElementById('name-input').value.trim()||'Anonymous';
  addScore(nm,score,gameMode);
  state='dead';
}

function tileX(objX, offset, tileW){
  return ((objX - offset % tileW) + tileW * 3) % tileW;
}

function drawRokuCityWindows(bx, by, bw, bh, cols, rows, winCol, frameOff){
  const padX=4, padY=5;
  const cellW=(bw-padX*2)/cols, cellH=(bh-padY*2)/rows;
  const ww=Math.max(2,cellW*0.55), wh=Math.max(2,cellH*0.55);
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      // Some windows off, some flicker
      const seed=(r*13+c*7+frameOff)%17;
      if(seed===0) continue; // window dark
      const flicker = seed===1 ? 0.3+0.4*Math.abs(Math.sin(frameCount*0.08+r+c)) : 1;
      ctx.globalAlpha=flicker*0.75;
      ctx.fillStyle=winCol;
      ctx.fillRect(
        bx + padX + c*cellW + (cellW-ww)/2,
        by + padY + r*cellH + (cellH-wh)/2,
        ww, wh
      );
    }
  }
  ctx.globalAlpha=1;
}

function drawNeonLine(x1,y1,x2,y2,col,glow=8){
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=glow;
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}

function drawBillboard(bx,by,bw,col,text){
  const bh=18, bbx=bx+bw*0.1, bby=by-bh-6, bbw=bw*0.8;
  // Billboard frame
  ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.fillStyle='#0a0520'; ctx.fillRect(bbx,bby,bbw,bh);
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.strokeRect(bbx,bby,bbw,bh);
  // Text
  ctx.fillStyle=col; ctx.font=`bold ${Math.min(10,bh*0.6)}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, bbx+bbw/2, bby+bh/2);
  // Support poles
  ctx.strokeStyle='#333355'; ctx.lineWidth=1.5; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.moveTo(bbx+bbw*0.3,bby+bh); ctx.lineTo(bbx+bbw*0.3,by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bbx+bbw*0.7,bby+bh); ctx.lineTo(bbx+bbw*0.7,by); ctx.stroke();
  ctx.shadowBlur=0;
}

function drawBackground(){
  // ── SKY ──────────────────────────────────────────────────
  const sky=ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,   RC.skyTop);
  sky.addColorStop(0.5, RC.skyMid);
  sky.addColorStop(0.8, RC.skyBot);
  sky.addColorStop(1,   RC.horizGlow);
  ctx.fillStyle=sky; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Horizon atmospheric glow
  const hg=ctx.createLinearGradient(0,GROUND_Y-80,0,GROUND_Y);
  hg.addColorStop(0,'rgba(61,26,110,0)');
  hg.addColorStop(1,'rgba(100,40,180,0.35)');
  ctx.fillStyle=hg; ctx.fillRect(0,GROUND_Y-80,canvas.width,80);

  // ── MOON ──────────────────────────────────────────────────
  ctx.save();
  ctx.shadowColor=RC.moonColor; ctx.shadowBlur=30;
  const mg=ctx.createRadialGradient(MOON.x,MOON.y,0,MOON.x,MOON.y,MOON.r);
  mg.addColorStop(0,'#ffffff'); mg.addColorStop(0.6,RC.moonColor); mg.addColorStop(1,'rgba(200,170,255,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(MOON.x,MOON.y,MOON.r*2.5,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#e0ccff'; ctx.beginPath(); ctx.arc(MOON.x,MOON.y,MOON.r,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // ── STARS ─────────────────────────────────────────────────
  STARS.forEach(s=>{
    const blink=0.35+0.65*Math.abs(Math.sin(frameCount*0.035+s.phase));
    ctx.globalAlpha=blink*0.85;
    ctx.fillStyle=s.col;
    const sx=tileX(s.x, px1, 800);
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // ── FAR BUILDINGS (layer 1 — 0.15x) ───────────────────────
  FAR_B.forEach(b=>{
    const bx=tileX(b.x, px1*0.15, 900);
    const by=GROUND_Y-b.h;
    ctx.fillStyle=RC.farBldg;
    ctx.fillRect(bx,by,b.w,b.h);
    if(b.hasSpire){
      ctx.fillRect(bx+b.w*0.4, by-b.spireH, b.w*0.2, b.spireH);
      // Spire tip glow
      ctx.shadowColor=RC.neonPurple; ctx.shadowBlur=6;
      ctx.fillStyle=RC.neonPurple;
      ctx.beginPath(); ctx.arc(bx+b.w*0.5, by-b.spireH, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle=RC.farBldg;
    }
  });

  // ── MID BUILDINGS (layer 2 — 0.35x) ───────────────────────
  MID_B.forEach(b=>{
    const bx=tileX(b.x, px2*0.35, 960);
    const topY=GROUND_Y-b.h;

    ctx.fillStyle=RC.midBldg;
    if(b.type==='setback'){
      // Stepped/setback shape
      const sw=b.w*b.setbackW, sx=bx+(b.w-sw)/2;
      const sh=b.h*b.setbackAt;
      ctx.fillRect(bx, topY+sh, b.w, b.h-sh);   // lower wide
      ctx.fillRect(sx, topY, sw, sh+2);           // upper narrow
      // Windows on lower
      drawRokuCityWindows(bx, topY+sh, b.w, b.h-sh, b.winCols, b.winRows, b.winCol, b.x);
      drawRokuCityWindows(sx, topY, sw, sh, b.winCols, Math.max(1,b.winRows-1), b.winCol, b.x+5);
    } else if(b.type==='tower'){
      const tw=b.w*0.5, tx=bx+(b.w-tw)/2;
      ctx.fillRect(bx, topY+b.h*0.3, b.w, b.h*0.7);   // base
      ctx.fillRect(tx, topY, tw, b.h);                   // tower
      drawRokuCityWindows(bx, topY+b.h*0.3, b.w, b.h*0.7, b.winCols+1, b.winRows, b.winCol, b.x);
      drawRokuCityWindows(tx, topY, tw, b.h*0.8, 2, b.winRows+1, b.winCol, b.x+3);
    } else {
      ctx.fillRect(bx, topY, b.w, b.h);
      drawRokuCityWindows(bx, topY, b.w, b.h*0.85, b.winCols, b.winRows, b.winCol, b.x);
    }

    // Roof details
    ctx.save();
    ctx.shadowColor=b.roofLight; ctx.shadowBlur=8;
    ctx.fillStyle=b.roofLight;
    // Blinking beacon
    const on=Math.floor(frameCount/45+b.x)%2===0;
    if(on) ctx.beginPath(),ctx.arc(bx+b.w/2, topY-2, 2, 0, Math.PI*2), ctx.fill();
    if(b.hasAntenna){
      ctx.shadowBlur=0; ctx.strokeStyle='#444466'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(bx+b.w*0.55,topY); ctx.lineTo(bx+b.w*0.55,topY-14); ctx.stroke();
      ctx.shadowColor=b.roofLight; ctx.shadowBlur=4;
      ctx.fillStyle=b.roofLight;
      ctx.beginPath(); ctx.arc(bx+b.w*0.55,topY-14,1.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // Subtle neon edge glow on tallest buildings
    if(b.h>120){
      drawNeonLine(bx, topY, bx, GROUND_Y, b.roofLight+'55', 6);
      drawNeonLine(bx+b.w, topY, bx+b.w, GROUND_Y, b.roofLight+'55', 6);
    }
  });

  // ── NEAR BUILDINGS (layer 3 — 0.65x) ──────────────────────
  NEAR_B.forEach(b=>{
    const bx=tileX(b.x, px3*0.65, 1050);
    const topY=GROUND_Y-b.h;

    ctx.fillStyle=RC.nearBldg;
    ctx.fillRect(bx, topY, b.w, b.h);

    // Dense windows
    drawRokuCityWindows(bx, topY, b.w, b.h*0.88, 4, 6, b.winCol, b.x);

    // Neon roof trim line
    drawNeonLine(bx, topY, bx+b.w, topY, b.roofLight, 10);

    // Billboard
    if(b.billboard) drawBillboard(bx, topY, b.w, b.billCol, b.billText);

    // AC units on roof
    ctx.fillStyle='#2a1f4e';
    ctx.fillRect(bx+4, topY-6, 10, 6);
    ctx.fillRect(bx+b.w-14, topY-6, 10, 6);

    // Neon vertical stripe on some buildings
    if(b.x%2===0){
      drawNeonLine(bx+b.w-4, topY, bx+b.w-4, GROUND_Y, b.roofLight+'66', 8);
    }
  });

  // ── SCROLLING GRID OVERLAY ─────────────────────────────────
  const sp=60, off=bgOffset%sp;
  ctx.strokeStyle='rgba(100,60,200,0.1)'; ctx.lineWidth=1;
  for(let x=-sp+off;x<canvas.width+sp;x+=sp){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GROUND_Y);ctx.stroke();}
  for(let y=0;y<GROUND_Y;y+=sp){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
}

function drawGround(){
  // Road surface — deep purple asphalt
  const g=ctx.createLinearGradient(0,GROUND_Y,0,canvas.height);
  g.addColorStop(0,'#22104a'); g.addColorStop(1,'#0a0520');
  ctx.fillStyle=g; ctx.fillRect(0,GROUND_Y,canvas.width,GROUND_H);

  // Neon ground edge glow (signature Roku City street)
  ctx.save();
  ctx.shadowColor=RC.neonPurple; ctx.shadowBlur=18;
  ctx.fillStyle=RC.neonPurple;
  ctx.fillRect(0,GROUND_Y,canvas.width,2);
  ctx.shadowBlur=0; ctx.restore();

  // Secondary teal strip
  ctx.save();
  ctx.shadowColor=RC.neonTeal; ctx.shadowBlur=8;
  ctx.fillStyle=RC.neonTeal+'99';
  ctx.fillRect(0,GROUND_Y+3,canvas.width,1);
  ctx.shadowBlur=0; ctx.restore();

  // Road lane markings scrolling
  const lw=30, lg=20, lTotal=lw+lg, lOff=bgOffset%(lTotal);
  ctx.fillStyle='rgba(157,92,246,0.25)';
  for(let x=-lTotal+lOff;x<canvas.width+lTotal;x+=lTotal){

  }

  // Ground reflection of neon (puddle effect)
  ctx.save();
  const rg=ctx.createLinearGradient(0,GROUND_Y,0,GROUND_Y+GROUND_H);
  rg.addColorStop(0,'rgba(100,40,180,0.18)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,GROUND_Y,canvas.width,GROUND_H);
  ctx.restore();
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function drawRokuRemote(cx,cy,angle){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  const W=24,H=36,ox=-W/2,oy=-H/2;
  ctx.shadowColor='rgba(140,80,255,0.5)'; ctx.shadowBlur=16;
  ctx.fillStyle='#1a1a2e'; rr(ox,oy,W,H,5); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#3a3a5e'; ctx.lineWidth=1; rr(ox,oy,W,H,5); ctx.stroke();
  ctx.fillStyle='#6c2bce'; rr(ox+4,oy+3,W-8,7,3); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 5px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ROKU',0,oy+6.5);
  const cx2=0,cy2=oy+18,dr=5.5,dl=3.5;
  ctx.fillStyle='#2e2e4e';
  ctx.fillRect(cx2-dr-dl,cy2-dl*0.6,(dr+dl)*2,dl*1.2);
  ctx.fillRect(cx2-dl*0.6,cy2-dr-dl,dl*1.2,(dr+dl)*2);
  ctx.fillStyle='#3a3a6e'; ctx.beginPath(); ctx.arc(cx2,cy2,dl*0.85,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8888bb';
  const as=1.4;
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{
    const bx2=cx2+dx*(dr+dl-2), by2=cy2+dy*(dr+dl-2);
    ctx.beginPath();
    if(dy<0){ctx.moveTo(bx2,by2);ctx.lineTo(bx2-as,by2+as*1.6);ctx.lineTo(bx2+as,by2+as*1.6);}
    else if(dy>0){ctx.moveTo(bx2,by2);ctx.lineTo(bx2-as,by2-as*1.6);ctx.lineTo(bx2+as,by2-as*1.6);}
    else if(dx<0){ctx.moveTo(bx2,by2);ctx.lineTo(bx2+as*1.6,by2-as);ctx.lineTo(bx2+as*1.6,by2+as);}
    else{ctx.moveTo(bx2,by2);ctx.lineTo(bx2-as*1.6,by2-as);ctx.lineTo(bx2-as*1.6,by2+as);}
    ctx.fill();
  });
  ctx.fillStyle='#6c2bce'; ctx.beginPath(); ctx.arc(cx2,cy2,2.2,0,Math.PI*2); ctx.fill();
  const bby=oy+H-8;
  [{x:ox+7,l:'←'},{x:ox+W-7,l:'⌂'}].forEach(({x,l})=>{
    ctx.fillStyle='#2e2e4e'; ctx.beginPath(); ctx.arc(x,bby,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7777aa'; ctx.font='3px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(l,x,bby);
  });
  ctx.restore();
}

function drawShip(cx,cy,angle){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  ctx.shadowColor='rgba(0,200,255,0.6)'; ctx.shadowBlur=18;
  ctx.fillStyle='#00c8ff';
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-14,-12); ctx.lineTo(-8,0); ctx.lineTo(-14,12); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#001a2e'; ctx.beginPath(); ctx.ellipse(4,0,8,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,200,255,0.25)'; ctx.beginPath(); ctx.ellipse(4,0,8,6,0,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='#ff8800'; ctx.shadowBlur=12;
  ctx.fillStyle='#ff8800'; ctx.beginPath(); ctx.moveTo(-14,-8); ctx.lineTo(-24,0); ctx.lineTo(-14,8); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
}

function drawWave(cx,cy,angle){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  ctx.shadowColor='rgba(0,255,150,0.6)'; ctx.shadowBlur=16;
  ctx.fillStyle='#00ff96';
  const s=CUBE_SIZE*0.55;
  ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-s*0.5,0); ctx.lineTo(s*0.5,0); ctx.stroke();
  ctx.shadowBlur=0; ctx.restore();
}

function drawPlayer(){
  const cx=player.x+CUBE_SIZE/2, cy=player.y+CUBE_SIZE/2;
  if(gameMode==='cube') drawRokuRemote(cx,cy,player.angle);
  else if(gameMode==='ship') drawShip(cx,cy,player.angle);
  else drawWave(cx,cy,player.angle);
}

function drawTrail(){
  let base='rgba(108,43,206';
  if(gameMode==='ship') base='rgba(0,200,255';
  else if(gameMode==='wave') base='rgba(0,255,150';
  player.trailPts.forEach((pt,i)=>{
    const a=(1-i/player.trailPts.length)*0.4;
    const s=CUBE_SIZE*(1-i/player.trailPts.length)*0.55;
    ctx.fillStyle=`${base},${a})`;
    ctx.fillRect(pt.x-s/2, pt.y-s/2, s, s);
  });
}

//  DRAW: TV OBSTACLES

function drawTVBody(tx,ty,tvW,tvH,screenColor,face,antennas,legsAtBottom){
  ctx.shadowBlur=0;
  ctx.fillStyle='#222233'; rr(tx,ty,tvW,tvH,4); ctx.fill();
  ctx.strokeStyle='#444466'; ctx.lineWidth=1.2; rr(tx,ty,tvW,tvH,4); ctx.stroke();
  const bx=tx+4, by=ty+4, bw=tvW-8, bh=tvH-14;
  ctx.fillStyle='#111122'; rr(bx,by,bw,bh,2); ctx.fill();
  ctx.save(); rr(bx,by,bw,bh,2); ctx.clip();
  ctx.fillStyle=screenColor; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  for(let sy=by;sy<by+bh;sy+=2) ctx.fillRect(bx,sy,bw,1);
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.ellipse(bx+bw*0.35,by+bh*0.3,bw*0.24,bh*0.19,-0.4,0,Math.PI*2); ctx.fill();
  if(face==='angry'){
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.5; ctx.lineCap='round';
    const fx=bx+bw/2, fy=by+bh/2, ew=bw*0.17;
    [-1,1].forEach(sx=>{ const ex=fx+sx*ew*2;
      ctx.beginPath();ctx.moveTo(ex-ew,fy-bh*0.15-ew);ctx.lineTo(ex+ew,fy-bh*0.15+ew);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ex+ew,fy-bh*0.15-ew);ctx.lineTo(ex-ew,fy-bh*0.15+ew);ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(fx,fy+bh*0.15,bw*0.19,0.2,Math.PI-0.2); ctx.stroke();
  } else if(face==='warn'){
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font=`bold ${Math.max(7,bh*0.55)}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('!',bx+bw/2,by+bh/2);
  }
  ctx.restore();
  if(legsAtBottom){
    ctx.fillStyle='#333355';
    ctx.fillRect(tx+tvW*0.15,ty+tvH-4,tvW*0.28,5);
    ctx.fillRect(tx+tvW*0.57,ty+tvH-4,tvW*0.28,5);
  }
  if(antennas==='top'){
    ctx.strokeStyle='#555577'; ctx.lineWidth=1.5; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx+tvW*0.38,ty);ctx.lineTo(tx+tvW*0.22,ty-9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx+tvW*0.62,ty);ctx.lineTo(tx+tvW*0.78,ty-9);ctx.stroke();
  } else if(antennas==='wall'){
    ctx.fillStyle='#333344';
    ctx.fillRect(tx+tvW*0.2,ty-5,tvW*0.25,6);
    ctx.fillRect(tx+tvW*0.55,ty-5,tvW*0.25,6);
  }
}

function drawSpike(o){
  ctx.save();
  const tvW=o.w+6, tvH=o.h, tx=o.x-3, ty=o.y-tvH;
  ctx.shadowColor='rgba(255,80,80,0.45)'; ctx.shadowBlur=12;
  drawTVBody(tx,ty,tvW,tvH,'#ff2200','angry','top',true);
  ctx.restore();
}

function drawCeilingSpike(o){
  ctx.save();
  const tvW=o.w+6, tvH=o.h, tx=o.x-3, ty=0;
  ctx.shadowColor='rgba(255,120,40,0.45)'; ctx.shadowBlur=12;
  drawTVBody(tx,ty,tvW,tvH,'#ff6600','warn','wall',false);
  // Spike tip pointing DOWN
  ctx.fillStyle='#ff8800'; ctx.shadowColor='rgba(255,136,0,0.6)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(tx+6,ty+tvH); ctx.lineTo(tx+tvW/2,ty+tvH+14); ctx.lineTo(tx+tvW-6,ty+tvH); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawPlatform(o){
  ctx.save();
  const tx=o.x, ty=o.y-6, tw=o.w, th=o.h+10;
  ctx.shadowColor='rgba(108,43,206,0.5)'; ctx.shadowBlur=10;
  ctx.fillStyle='#1e1e33'; rr(tx,ty,tw,th,5); ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#5544aa'; ctx.lineWidth=1.2; rr(tx,ty,tw,th,5); ctx.stroke();
  const sx=tx+4,sy=ty+3,sw=tw-8,sh=th-8;
  ctx.fillStyle='#0a0a1a'; rr(sx,sy,sw,sh,3); ctx.fill();
  ctx.save(); rr(sx,sy,sw,sh,3); ctx.clip();
  const pg=ctx.createLinearGradient(sx,sy,sx+sw,sy+sh);
  pg.addColorStop(0,'#3a0ca3'); pg.addColorStop(1,'#7209b7');
  ctx.fillStyle=pg; ctx.fillRect(sx,sy,sw,sh);
  ctx.fillStyle='rgba(0,0,0,0.2)';
  for(let sl=sy;sl<sy+sh;sl+=2) ctx.fillRect(sx,sl,sw,1);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.font=`bold ${Math.max(5,sh*0.55)}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('ROKU',sx+sw/2,sy+sh/2);
  ctx.restore();
  ctx.fillStyle='#333355'; ctx.fillRect(tx+tw/2-5,ty+th,10,4);
  ctx.restore();
}

function drawTVWall(o){
  ctx.save();
  const gapTop=o.gapY-10, gapBot=o.gapY+o.gapH;
  function stackTVs(fromY,toY){
    let y=fromY;
    while(y<toY){
      const h=Math.min(44,toY-y); if(h<10){y+=h;continue;}
      ctx.fillStyle='#1a1530'; rr(o.x,y,o.w,h-2,3); ctx.fill();
      ctx.strokeStyle='#443366'; ctx.lineWidth=1; rr(o.x,y,o.w,h-2,3); ctx.stroke();
      if(h>18){
        const sx=o.x+3,sy=y+3,sw=o.w-6,sh=h-10;
        ctx.fillStyle='#0a0a1a'; rr(sx,sy,sw,sh,2); ctx.fill();
        ctx.save(); rr(sx,sy,sw,sh,2); ctx.clip();
        ctx.fillStyle=y%88<44?'#1a0a4a':'#2a1a00'; ctx.fillRect(sx,sy,sw,sh);
        ctx.fillStyle='rgba(0,0,0,0.18)';
        for(let sl=sy;sl<sy+sh;sl+=2) ctx.fillRect(sx,sl,sw,1);
        ctx.restore();
      }
      y+=44;
    }
  }
  ctx.shadowColor='rgba(108,43,206,0.35)'; ctx.shadowBlur=16;
  stackTVs(0,gapTop); stackTVs(gapBot,canvas.height);
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(157,92,246,0.45)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(o.x,gapTop);ctx.lineTo(o.x+o.w,gapTop);ctx.stroke();
  ctx.beginPath();ctx.moveTo(o.x,gapBot);ctx.lineTo(o.x+o.w,gapBot);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawObstacles(){
  for(const o of obstacles){
    if(o.type==='spike')          drawSpike(o);
    else if(o.type==='ceiling_spike') drawCeilingSpike(o);
    else if(o.type==='platform')  drawPlatform(o);
    else if(o.type==='tvwall')    drawTVWall(o);
  }
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.square) ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });
  ctx.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────
//  DRAW: HUD
// ─────────────────────────────────────────────────────────────
const TIER_NAMES =['EASY','NORMAL','HARD','INTENSE','CHAOS'];
const TIER_COLORS=['#52b788','#ffe066','#f4a261','#ff4466','#cc00ff'];
const MODE_ICONS ={cube:'📦',ship:'🚀',wave:'〰️'};

function drawHUD(){
  const tier=getTier();
  ctx.textBaseline='top';
  ctx.fillStyle='#9d5cf6'; ctx.font='bold 22px "Segoe UI"'; ctx.textAlign='left';
  ctx.fillText(`Score: ${score}`,16,12);
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='13px "Segoe UI"';
  ctx.fillText(`Best: ${getBest()}`,16,38);
  ctx.fillStyle=TIER_COLORS[tier]; ctx.font='bold 12px "Segoe UI"';
  ctx.fillText(`⚡ ${TIER_NAMES[tier]}`,16,58);
  ctx.textAlign='right';
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='13px "Segoe UI"';
  ctx.fillText(`${MODE_ICONS[gameMode]||''} ${gameMode.toUpperCase()}`,canvas.width-12,12);
  if(gameMode==='cube'){
    for(let i=0;i<2;i++){
      ctx.fillStyle=i<player.jumpsLeft?'#9d5cf6':'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(canvas.width-24-i*22,48,7,0,Math.PI*2); ctx.fill();
    }
  }
}

// ─────────────────────────────────────────────────────────────
//  DRAW: TIER TRANSITION BANNER
// ─────────────────────────────────────────────────────────────
function drawTierBanner(){
  if(!banner.on) return;
  banner.timer++;
  const dur=130;
  if(banner.timer>=dur){ banner.on=false; return; }
  const t=banner.timer;
  let alpha = t<20 ? t/20 : t>dur-30 ? (dur-t)/30 : 1;
  const scale = t<20 ? 0.5+0.5*(t/20) : 1+Math.sin((t-20)*0.15)*0.025;
  const color=TIER_COLORS[banner.tier];
  const label=TIER_NAMES[banner.tier];

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(canvas.width/2, GROUND_Y/2-20);
  ctx.scale(scale,scale);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.fillStyle='rgba(10,5,30,0.8)';
  rr(-165,-40,330,78,16); ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=2;
  rr(-165,-40,330,78,16); ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='bold 13px "Segoe UI"';
  ctx.fillText('⚡  TIER UP',0,-18);

  ctx.fillStyle=color; ctx.font='bold 32px "Segoe UI"';
  ctx.shadowColor=color; ctx.shadowBlur=18;
  ctx.fillText(label,0,16);
  ctx.shadowBlur=0;

  ctx.restore();
  ctx.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────
//  DRAW: WAIT / DEATH SCREENS
// ─────────────────────────────────────────────────────────────
function drawWaitScreen(){
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#9d5cf6'; ctx.font='bold 52px "Segoe UI"';
  ctx.shadowColor='rgba(108,43,206,0.9)'; ctx.shadowBlur=32;
  ctx.fillText('ROKU DASH',canvas.width/2,canvas.height/2-90);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.font='13px "Segoe UI"';
  ctx.fillText('Choose a mode below · Level Editor · Leaderboard',canvas.width/2,canvas.height/2+95);
}

function drawDeathScreen(){
  deathTimer++;
  const shake=Math.max(0,12-deathTimer*0.35);
  ctx.save();
  ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  const oa=Math.min(0.78,deathTimer*0.028);
  ctx.fillStyle=`rgba(0,0,0,${oa})`; ctx.fillRect(0,0,canvas.width,canvas.height);

  if(deathTimer>15){
    const ba=Math.max(0,0.9-deathTimer*0.012);
    ctx.strokeStyle=`rgba(255,40,70,${ba})`; ctx.lineWidth=14;
    ctx.strokeRect(7,7,canvas.width-14,canvas.height-14);
    ctx.save();
    for(let i=0;i<65;i++){
      ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.05})`;
      ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,3+Math.random()*28,1+Math.random()*4);
    }
    ctx.restore();
  }

  if(deathTimer>38){
    const slide=Math.min(1,(deathTimer-38)*0.055);
    const pY=canvas.height/2-120+(1-slide)*90;
    const pW=420, pX=canvas.width/2-pW/2;

    ctx.fillStyle='rgba(10,8,30,0.94)'; rr(pX,pY,pW,240,18); ctx.fill();
    ctx.strokeStyle='#6c2bce'; ctx.lineWidth=2; rr(pX,pY,pW,240,18); ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='middle';

    ctx.fillStyle='#ff4466'; ctx.font='bold 34px "Segoe UI"';
    ctx.shadowColor='rgba(255,40,70,0.9)'; ctx.shadowBlur=22;
    ctx.fillText('📺 NO SIGNAL',canvas.width/2,pY+48); ctx.shadowBlur=0;

    ctx.fillStyle='#fff'; ctx.font='20px "Segoe UI"';
    ctx.fillText(`Score: ${score}`,canvas.width/2,pY+95);

    const lb=getLB();
    if(lb.length>0&&lb[0].score===score&&score>0){
      ctx.fillStyle='#ffe000'; ctx.font='bold 14px "Segoe UI"';
      ctx.fillText('✦ NEW TOP SCORE ✦',canvas.width/2,pY+124);
    } else if(lb.length>0){
      ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='13px "Segoe UI"';
      ctx.fillText(`Top score: ${lb[0].score} by ${lb[0].name}`,canvas.width/2,pY+124);
    }
    ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.font='13px "Segoe UI"';
    ctx.fillText(`Mode: ${gameMode.toUpperCase()}`,canvas.width/2,pY+152);

    if(Math.floor(deathTimer/22)%2===0){
      ctx.fillStyle='rgba(157,92,246,0.95)'; ctx.font='15px "Segoe UI"';
      ctx.fillText('SPACE or click to retry',canvas.width/2,pY+190);
    }
  }
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────
//  GAME RESET / MODE
// ─────────────────────────────────────────────────────────────
function resetGame(){
  player.reset(); obstacles=[]; particles=[];
  spawnTimer=0; spawnInterval=88; score=0; frameCount=0; deathTimer=0;
  scrollSpd=BASE_SPD; pressing=false; wasOnGround=true;
  lastTier=0; banner={on:false,timer:0,tier:0};
  if(customLevel) obstacles=[...customLevel.map(o=>({...o}))];
  state='playing';
}

function setMode(m){
  gameMode=m;
  document.querySelectorAll('#ui-bar .btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`btn-${m}`).classList.add('active');
}

// ─────────────────────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────────────────────
function onDown(){
  if(state==='waiting') return;
  if(state==='dead'&&deathTimer>38){ resetGame(); return; }
  if(state==='playing'){ pressing=true; player.action(); }
}
function onUp(){ pressing=false; }

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();onDown();}
  if(e.code==='Escape'){closeEditor();closeLeaderboard();}
});
document.addEventListener('keyup',e=>{ if(e.code==='Space') onUp(); });
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown();},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onUp();},{passive:false});

// ─────────────────────────────────────────────────────────────
//  NAME OVERLAY
// ─────────────────────────────────────────────────────────────
function positionOverlay(){
  const ov=document.getElementById('name-overlay');
  ov.style.top=(canvas.height/2-50)+'px';
  ov.style.left='50%';
  ov.style.transform='translateX(-50%)';
}
function startFromOverlay(){
  const inp=document.getElementById('start-name-input');
  const val=inp.value.trim();
  if(!val){
    inp.placeholder='Please enter a name first!';
    inp.style.borderColor='#ff4466';
    inp.style.boxShadow='0 0 16px rgba(255,68,102,0.5)';
    setTimeout(()=>{inp.placeholder='Enter your name…';inp.style.borderColor='#6c2bce';inp.style.boxShadow='';},1500);
    return;
  }
  document.getElementById('name-input').value=val;
  const ov=document.getElementById('name-overlay');
  ov.classList.remove('active'); ov.style.display='none';
  resetGame();
}
document.getElementById('start-name-input').addEventListener('keydown',e=>{ if(e.key==='Enter') startFromOverlay(); });
positionOverlay();

// ─────────────────────────────────────────────────────────────
//  MAIN LOOP
// ─────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  bgOffset+=scrollSpd;

  if(state==='playing'||state==='dead'){
    px1+=scrollSpd*0.10;
    px2+=scrollSpd*0.25;
    px3+=scrollSpd*0.50;
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawGround();

  if(state==='playing'){
    player.update();
    if(!customLevel) updateObstacles();
    else { obstacles.forEach(o=>o.x-=scrollSpd); obstacles=obstacles.filter(o=>o.x>-300); }
    updateParticles();
    checkCollisions();
    frameCount++;
    if(frameCount%60===0){
      score++;
      sfxTick();
      const tierSpeeds=[5,6.5,8,10,12];
      const ts=tierSpeeds[getTier()]+score*0.05;
      scrollSpd=Math.min(ts,14);
      const newTier=getTier();
      if(newTier>lastTier){
        banner={on:true,timer:0,tier:newTier};
        lastTier=newTier;
        sfxTierUp();
      }
    }
  }

  if(state==='playing'||state==='dead'){
    drawTrail(); drawObstacles(); drawParticles();
    if(player.alive) drawPlayer();
    drawHUD();
    drawTierBanner();
  }
  if(state==='waiting') drawWaitScreen();
  if(state==='dead')    drawDeathScreen();
}
loop();

// ─────────────────────────────────────────────────────────────
//  LEVEL EDITOR
// ─────────────────────────────────────────────────────────────
const edCanvas=document.getElementById('editor-canvas');
const edCtx=edCanvas.getContext('2d');
const GRID=40, ED_GY=edCanvas.height-50;
let edObstacles=[], edTool='spike';

function selectTool(t){
  edTool=t;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById(`tool-${t}`).classList.add('selected');
}
function openEditor(){ document.getElementById('editor-panel').classList.add('open'); renderEdCanvas(); renderSavedLevels(); }
function closeEditor(){ document.getElementById('editor-panel').classList.remove('open'); }

function getCell(e){
  const r=edCanvas.getBoundingClientRect();
  const mx=(e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:0))-r.left;
  const my=(e.clientY||(e.touches&&e.touches[0]?e.touches[0].clientY:0))-r.top;
  return {col:Math.floor(mx/GRID),row:Math.floor(my/GRID),x:Math.floor(mx/GRID)*GRID,y:Math.floor(my/GRID)*GRID};
}

edCanvas.addEventListener('click',e=>{
  const {col,row,x,y}=getCell(e);
  if(edTool==='erase'){
    edObstacles=edObstacles.filter(o=>!(Math.floor(o.edX/GRID)===col&&Math.floor(o.edY/GRID)===row));
  } else if(edTool==='spike'){
    if(!edObstacles.find(o=>o.edX===x&&o.type==='spike'))
      edObstacles.push({type:'spike',edX:x,edY:ED_GY,x,y:ED_GY,w:36,h:38});
  } else if(edTool==='platform'){
    if(!edObstacles.find(o=>o.edX===x&&o.edY===y&&o.type==='platform'))
      edObstacles.push({type:'platform',edX:x,edY:y,x,y,w:80,h:14});
  }
  renderEdCanvas();
});

function renderEdCanvas(){
  edCtx.fillStyle='#0d0d2b'; edCtx.fillRect(0,0,edCanvas.width,edCanvas.height);
  edCtx.strokeStyle='rgba(80,60,180,0.2)'; edCtx.lineWidth=1;
  for(let x=0;x<edCanvas.width;x+=GRID){edCtx.beginPath();edCtx.moveTo(x,0);edCtx.lineTo(x,edCanvas.height);edCtx.stroke();}
  for(let y=0;y<edCanvas.height;y+=GRID){edCtx.beginPath();edCtx.moveTo(0,y);edCtx.lineTo(edCanvas.width,y);edCtx.stroke();}
  edCtx.fillStyle='#2a1f5e'; edCtx.fillRect(0,ED_GY,edCanvas.width,50);
  edCtx.fillStyle='#9d5cf6'; edCtx.fillRect(0,ED_GY,edCanvas.width,2);
  edObstacles.forEach(o=>{
    if(o.type==='spike'){
      edCtx.fillStyle='#ff4466';
      edCtx.beginPath();edCtx.moveTo(o.x,o.y);edCtx.lineTo(o.x+o.w/2,o.y-o.h);edCtx.lineTo(o.x+o.w,o.y);edCtx.closePath();edCtx.fill();
    } else {
      edCtx.fillStyle='#6c2bce'; edCtx.fillRect(o.x,o.y,o.w,o.h);
    }
  });
  edCtx.fillStyle='rgba(157,92,246,0.4)'; edCtx.fillRect(10,ED_GY-36,24,24);
  edCtx.fillStyle='rgba(255,255,255,0.35)'; edCtx.font='9px Segoe UI';
  edCtx.textAlign='left'; edCtx.textBaseline='middle'; edCtx.fillText('START',38,ED_GY-24);
}

function clearEditorLevel(){ edObstacles=[]; renderEdCanvas(); }

function saveEditorLevel(){
  if(!edObstacles.length){ alert('Add some obstacles first!'); return; }
  const name=prompt('Name your level:','My Level'); if(!name) return;
  const lvls=getSavedLevels();
  lvls.push({name,obstacles:JSON.parse(JSON.stringify(edObstacles))});
  localStorage.setItem('rd_levels',JSON.stringify(lvls));
  renderSavedLevels();
}

function getSavedLevels(){ try{return JSON.parse(localStorage.getItem('rd_levels')||'[]');}catch{return[];} }

function renderSavedLevels(){
  const el=document.getElementById('level-list');
  const lvls=getSavedLevels();
  if(!lvls.length){ el.innerHTML='<span style="color:#444;font-size:0.8rem;">No saved levels yet.</span>'; return; }
  el.innerHTML=lvls.map((l,i)=>`
    <div class="level-chip">${l.name}
      <button class="chip-btn" style="color:#9d5cf6" onclick="loadLevel(${i})">▶ Play</button>
      <button class="chip-btn" style="color:#ff4466" onclick="deleteLevel(${i})">✕</button>
    </div>`).join('');
}

function loadLevel(i){
  const lvl=getSavedLevels()[i];
  const xs=canvas.width/edCanvas.width, ys=canvas.height/edCanvas.height;
  customLevel=lvl.obstacles.map(o=>({...o,
    x:o.edX*xs+canvas.width,
    y:o.type==='spike'?GROUND_Y:o.edY*ys
  }));
  closeEditor(); state='waiting';
}

function deleteLevel(i){
  const lvls=getSavedLevels(); lvls.splice(i,1);
  localStorage.setItem('rd_levels',JSON.stringify(lvls)); renderSavedLevels();
}

function playEditorLevel(){
  if(!edObstacles.length){ alert('Add some obstacles first!'); return; }
  const xs=canvas.width/edCanvas.width, ys=canvas.height/edCanvas.height;
  customLevel=edObstacles.map(o=>({...o,
    x:o.edX*xs+canvas.width,
    y:o.type==='spike'?GROUND_Y:o.edY*ys
  }));
  closeEditor(); resetGame();
}

renderEdCanvas();
</script>
